<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tucson Office Courier payment confirmation.">
  <title>Payment Confirmation | Tucson Office Courier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{brand:'#ea580c',ink:'#111827'},fontFamily:{sans:['Inter','ui-sans-serif','system-ui','sans-serif']}}}}
  </script>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-ink antialiased">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-xl rounded-2xl bg-white p-7 text-center shadow-xl sm:p-10" aria-labelledby="confirmation-title">
      <div id="status-icon" class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-orange-100 text-3xl text-brand" aria-hidden="true">…</div>
      <p class="mt-6 text-xs font-bold tracking-[.18em] text-brand">SECURE CHECKOUT</p>
      <h1 id="confirmation-title" class="mt-2 text-3xl font-extrabold tracking-tight">Confirming your payment</h1>
      <p id="confirmation-message" class="mx-auto mt-4 max-w-md leading-7 text-slate-600" role="status" aria-live="polite">Please wait while we verify the payment with Stripe.</p>
      <dl id="confirmation-details" class="mt-7 hidden rounded-xl border border-slate-200 bg-slate-50 p-5 text-left"></dl>
      <a href="services.html" class="mt-8 inline-flex min-h-[48px] items-center justify-center rounded-lg bg-brand px-6 py-3 font-bold text-white transition hover:bg-orange-700">Return to Start Your Delivery</a>
    </section>
  </main>
  <script>
    const message=document.querySelector('#confirmation-message');
    const title=document.querySelector('#confirmation-title');
    const icon=document.querySelector('#status-icon');
    const details=document.querySelector('#confirmation-details');
    const sessionId=new URLSearchParams(location.search).get('session_id')||'';
    const escapeHtml=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');

    async function verifyPayment(){
      if(!sessionId){
        title.textContent='Payment confirmation unavailable';
        message.textContent='The Stripe checkout session number is missing. Please return to the delivery page.';
        icon.textContent='!';
        return;
      }
      try{
        const response=await fetch('/api/checkout-session?session_id='+encodeURIComponent(sessionId));
        const data=await response.json();
        if(!response.ok||!data.paid)throw new Error(data.message||'Stripe has not confirmed this payment.');
        icon.textContent='✓';
        title.textContent='Payment successful';
        message.textContent='Your delivery request has been paid and submitted. Keep the request number below for your records.';
        details.classList.remove('hidden');
        details.innerHTML=`<div class="grid gap-1 border-b border-slate-200 pb-3 sm:grid-cols-[130px_1fr]"><dt class="text-sm font-semibold text-slate-500">Request ID</dt><dd class="font-bold">${escapeHtml(data.requestId)}</dd></div><div class="grid gap-1 border-b border-slate-200 py-3 sm:grid-cols-[130px_1fr]"><dt class="text-sm font-semibold text-slate-500">Service</dt><dd class="font-medium">${escapeHtml(data.service)}</dd></div><div class="grid gap-1 pt-3 sm:grid-cols-[130px_1fr]"><dt class="text-sm font-semibold text-slate-500">Amount paid</dt><dd class="font-bold text-brand">$${Number(data.amount).toFixed(2)}</dd></div>`;
      }catch(error){
        icon.textContent='!';
        title.textContent='Payment confirmation pending';
        message.textContent=error.message+' If you completed payment, keep your Stripe receipt and try this page again shortly.';
      }
    }
    verifyPayment();
  </script>
</body>
</html>
